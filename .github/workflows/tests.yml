# Every push runs the full suite on a real Mac and a real Windows
# machine.  The gesture code is platform-neutral, which means a change
# made on one platform IS a change to the other -- this is what catches
# it on the other one the minute it is made, instead of on demo day.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  suite:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run the suite
        run: python -m unittest discover tests
